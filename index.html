<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Marble Run Race</title>
<style>
:root{--bg:#0b1020;--panel:#151d33dd;--text:#f7f9ff;--muted:#aeb8cc;--accent:#ffd84a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(160deg,#0b1020,#20284a);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
body{display:flex;justify-content:center;align-items:center;padding:max(8px,env(safe-area-inset-top)) 8px max(8px,env(safe-area-inset-bottom))}
.app{width:min(1180px,100%);height:100%;max-height:820px;display:grid;grid-template-rows:auto 1fr auto;gap:8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--panel);border:1px solid #ffffff16;border-radius:14px;padding:9px 12px}
.title{font-weight:900;font-size:clamp(17px,2.8vw,27px)} .sub{font-size:12px;color:var(--muted)} .timer{font-weight:900;color:var(--accent);font-variant-numeric:tabular-nums;font-size:clamp(18px,3vw,27px)}
.stage{position:relative;min-height:0;overflow:hidden;border-radius:16px;border:1px solid #ffffff17;background:#090d18}
canvas{width:100%;height:100%;display:block}
.minimap{position:absolute;right:10px;top:10px;width:min(25vw,190px);height:min(31vh,230px);background:#0d1324e8;border:1px solid #ffffff2a;border-radius:13px;padding:6px;pointer-events:none}
.minimap canvas{width:100%;height:100%;border-radius:9px}
.maplabel{position:absolute;left:9px;top:7px;font-size:10px;font-weight:900;letter-spacing:.08em;color:#dce5ff;background:#0d1324c9;padding:3px 6px;border-radius:6px}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.card{width:min(420px,calc(100% - 28px));padding:22px;background:#11172bee;border:1px solid #ffffff24;border-radius:20px;text-align:center;box-shadow:0 20px 60px #0008}
.card h2{margin:0 0 8px;font-size:clamp(25px,6vw,42px)} .card p{margin:0 0 16px;color:var(--muted);line-height:1.45}
button{border:0;border-radius:14px;padding:14px 22px;background:var(--accent);font-size:17px;font-weight:900;color:#171717;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.countdown{font-size:clamp(64px,15vw,150px);font-weight:1000;text-shadow:0 12px 40px #000}
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.row{background:var(--panel);border:1px solid #ffffff13;border-radius:12px;padding:7px 9px;display:flex;align-items:center;gap:7px;min-width:0}.dot{width:17px;height:17px;border-radius:50%;box-shadow:inset -4px -4px 7px #0007,inset 4px 4px 5px #fff6;flex:0 0 auto}.name{font-weight:800;overflow:hidden;text-overflow:ellipsis}.place{margin-left:auto;color:var(--muted);font-weight:900}.winner{color:var(--accent)}
@media(max-width:650px){.hud{grid-template-columns:repeat(2,1fr)}.sub{display:none}.minimap{width:116px;height:150px;right:6px;top:6px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><div class="title">MARBLE RUN RACE</div><div class="sub">Camera follows the race. Minimap shows the whole course.</div></div>
    <div class="timer" id="timer">00.0</div>
  </div>
  <div class="stage" id="stage">
    <canvas id="game"></canvas>
    <div class="minimap"><div class="maplabel">COURSE</div><canvas id="map"></canvas></div>
    <div class="overlay" id="overlay">
      <div class="card"><h2>Ready to Race?</h2><p>Four marbles race a full course in roughly 30 seconds.</p><button id="startBtn">START RACE</button></div>
    </div>
  </div>
  <div class="hud" id="hud"></div>
</div>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const mapCanvas=document.getElementById('map'),mctx=mapCanvas.getContext('2d');
const stage=document.getElementById('stage'),overlay=document.getElementById('overlay'),timerEl=document.getElementById('timer'),hud=document.getElementById('hud');
const DEF=[{name:'Ruby',color:'#ff3b5c'},{name:'Azure',color:'#3ea0ff'},{name:'Lime',color:'#70e35a'},{name:'Gold',color:'#ffd23f'}];
let DPR=1,W=0,H=0,MW=0,MH=0,track,marbles=[],state='idle',startTime=0,last=0,raf=0,finishOrder=[],cameraS=0;
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){
 const r=stage.getBoundingClientRect();DPR=Math.min(devicePixelRatio||1,2);W=Math.max(320,Math.floor(r.width));H=Math.max(360,Math.floor(r.height));
 canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
 const mr=mapCanvas.getBoundingClientRect();MW=Math.max(90,Math.floor(mr.width));MH=Math.max(120,Math.floor(mr.height));mapCanvas.width=MW*DPR;mapCanvas.height=MH*DPR;mctx.setTransform(DPR,0,0,DPR,0,0);
 buildTrack();if(state==='idle')reset();draw();
}
addEventListener('resize',resize);
function buildTrack(){
 const worldH=3200,worldW=900,laneW=120,N=95,pts=[];
 for(let i=0;i<N;i++){
  const t=i/(N-1),y=90+t*(worldH-180),amp=worldW*.27*(.7+.3*Math.sin(t*Math.PI));
  let x=worldW/2+Math.sin(t*Math.PI*6.2+.2)*amp*.72+Math.sin(t*Math.PI*15.6)*amp*.10;
  if(i<3||i>N-4)x=worldW/2;
  pts.push({x:clamp(x,110,worldW-110),y});
 }
 let total=0;for(let i=0;i<N;i++){if(i){let dx=pts[i].x-pts[i-1].x,dy=pts[i].y-pts[i-1].y;total+=Math.hypot(dx,dy)}pts[i].s=total}
 const obstacles=[];for(let k=8;k<N-7;k+=8)obstacles.push({s:pts[k].s+rnd(-30,30),type:['bumper','gate','spinner'][Math.floor(Math.random()*3)],phase:rnd(0,6.28)});
 track={pts,total,laneW,worldW,worldH,obstacles};
}
function pointAt(s){
 s=clamp(s,0,track.total);let p=track.pts,i=1;while(i<p.length&&p[i].s<s)i++;i=Math.min(i,p.length-1);
 const a=p[i-1],b=p[i],span=b.s-a.s||1,t=(s-a.s)/span,x=a.x+(b.x-a.x)*t,y=a.y+(b.y-a.y)*t,dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1;
 return{x,y,tx:dx/L,ty:dy/L,nx:-dy/L,ny:dx/L};
}
function reset(){
 finishOrder=[];cameraS=0;marbles=DEF.map((m,i)=>({...m,s:0,v:0,lat:(i-1.5)*22,latV:rnd(-4,4),spin:rnd(0,6.28),finished:false,finishTime:null,rank:i+1,lastObs:-1,seed:rnd(0,1000)}));
 timerEl.textContent='00.0';updateHud();draw();
}
function makeHud(){hud.innerHTML='';DEF.forEach((m,i)=>{let d=document.createElement('div');d.className='row';d.innerHTML=`<span class="dot" style="background:${m.color}"></span><span class="name">${m.name}</span><span class="place" id="p${i}">${i+1}</span>`;hud.appendChild(d)})}
const ord=n=>n===1?'1st':n===2?'2nd':n===3?'3rd':'4th';
function updateHud(){marbles.forEach((m,i)=>{let e=document.getElementById('p'+i);if(e)e.textContent=m.finished?ord(finishOrder.indexOf(i)+1):ord(m.rank)})}
function worldToScreen(q){
 const focus=pointAt(cameraS),scale=Math.min(W/640,H/850)*1.22;
 return{x:W/2+(q.x-focus.x)*scale,y:H*.38+(q.y-focus.y)*scale,scale};
}
function drawTrackSegment(){
 ctx.clearRect(0,0,W,H);let bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#161d32');bg.addColorStop(1,'#070a12');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 const p=track.pts,vis=[];for(const q of p){let s=worldToScreen(q);if(s.y>-180&&s.y<H+180)vis.push({q,s})}
 if(vis.length<2)return;
 ctx.lineJoin='round';ctx.lineCap='round';
 const path=()=>{ctx.beginPath();ctx.moveTo(vis[0].s.x,vis[0].s.y);for(let i=1;i<vis.length;i++)ctx.lineTo(vis[i].s.x,vis[i].s.y)};
 path();ctx.strokeStyle='#02040a';ctx.lineWidth=track.laneW*vis[0].s.scale+22;ctx.stroke();
 path();let g=ctx.createLinearGradient(0,0,W,0);g.addColorStop(0,'#59657f');g.addColorStop(.5,'#a8b2c8');g.addColorStop(1,'#515c73');ctx.strokeStyle=g;ctx.lineWidth=track.laneW*vis[0].s.scale;ctx.stroke();
 path();ctx.strokeStyle='#222a40';ctx.lineWidth=(track.laneW-18)*vis[0].s.scale;ctx.stroke();
 for(const o of track.obstacles){let q=pointAt(o.s),sc=worldToScreen(q);if(sc.y<-80||sc.y>H+80)continue;ctx.save();ctx.translate(sc.x,sc.y);let L=track.laneW*.31*sc.scale;
  if(o.type==='bumper'){ctx.fillStyle='#ff7043';ctx.beginPath();ctx.arc(q.nx*20*sc.scale,q.ny*20*sc.scale,11*sc.scale,0,6.28);ctx.fill()}
  else if(o.type==='gate'){ctx.rotate(Math.atan2(q.ty,q.tx));ctx.strokeStyle='#f3d45f';ctx.lineWidth=5*sc.scale;ctx.beginPath();ctx.moveTo(0,-L);ctx.lineTo(0,L);ctx.stroke()}
  else{ctx.rotate(performance.now()/700+o.phase);ctx.strokeStyle='#79e0ff';ctx.lineWidth=5*sc.scale;ctx.beginPath();ctx.moveTo(-L,0);ctx.lineTo(L,0);ctx.stroke();ctx.fillStyle='#79e0ff';ctx.beginPath();ctx.arc(0,0,7*sc.scale,0,6.28);ctx.fill()}
 ctx.restore()}
 const finish=worldToScreen(pointAt(track.total));if(finish.y>-60&&finish.y<H+60){ctx.strokeStyle='#fff';ctx.lineWidth=10*finish.scale;ctx.setLineDash([10*finish.scale,10*finish.scale]);ctx.beginPath();ctx.moveTo(finish.x-track.laneW*.4*finish.scale,finish.y);ctx.lineTo(finish.x+track.laneW*.4*finish.scale,finish.y);ctx.stroke();ctx.setLineDash([])}
}
function drawMarble(m){
 let q=pointAt(m.s),base={x:q.x+q.nx*m.lat,y:q.y+q.ny*m.lat},s=worldToScreen(base),r=15*s.scale;if(s.y<-r*2||s.y>H+r*2)return;
 ctx.save();ctx.translate(s.x,s.y);ctx.rotate(m.spin);ctx.shadowColor='#000a';ctx.shadowBlur=8;ctx.shadowOffsetY=5;
 let grad=ctx.createRadialGradient(-r*.35,-r*.38,2,0,0,r);grad.addColorStop(0,'#fff');grad.addColorStop(.18,m.color);grad.addColorStop(1,'#101218');ctx.fillStyle=grad;ctx.beginPath();ctx.arc(0,0,r,0,6.28);ctx.fill();
 ctx.shadowColor='transparent';ctx.strokeStyle='#ffffff88';ctx.lineWidth=Math.max(1,2*s.scale);ctx.beginPath();ctx.arc(0,0,r*.62,-1.1,1.1);ctx.stroke();
 ctx.strokeStyle='#00000055';ctx.beginPath();ctx.moveTo(-r*.65,0);ctx.lineTo(r*.65,0);ctx.stroke();ctx.restore();
}
function drawMap(){
 mctx.clearRect(0,0,MW,MH);mctx.fillStyle='#0c1222';mctx.fillRect(0,0,MW,MH);
 const pad=14,sx=(MW-pad*2)/track.worldW,sy=(MH-pad*2)/track.worldH,sc=Math.min(sx,sy),ox=(MW-track.worldW*sc)/2,oy=(MH-track.worldH*sc)/2;
 mctx.lineJoin='round';mctx.lineCap='round';mctx.beginPath();track.pts.forEach((p,i)=>{let x=ox+p.x*sc,y=oy+p.y*sc;i?mctx.lineTo(x,y):mctx.moveTo(x,y)});mctx.strokeStyle='#526078';mctx.lineWidth=Math.max(4,track.laneW*sc);mctx.stroke();
 mctx.strokeStyle='#9ca9bf';mctx.lineWidth=1.5;mctx.stroke();
 marbles.forEach(m=>{let q=pointAt(m.s),x=ox+(q.x+q.nx*m.lat)*sc,y=oy+(q.y+q.ny*m.lat)*sc;mctx.fillStyle=m.color;mctx.beginPath();mctx.arc(x,y,4.5,0,6.28);mctx.fill();mctx.strokeStyle='#fff';mctx.lineWidth=1;mctx.stroke()});
 let fq=pointAt(cameraS),fy=oy+fq.y*sc;mctx.strokeStyle='#ffffff66';mctx.lineWidth=1;mctx.setLineDash([3,3]);mctx.beginPath();mctx.moveTo(4,fy);mctx.lineTo(MW-4,fy);mctx.stroke();mctx.setLineDash([]);
}
function draw(){if(!track)return;drawTrackSegment();[...marbles].sort((a,b)=>a.s-b.s).forEach(drawMarble);drawMap()}
function collide(){
 for(let i=0;i<marbles.length;i++)for(let j=i+1;j<marbles.length;j++){let a=marbles[i],b=marbles[j];if(a.finished||b.finished)continue;let ds=a.s-b.s,dl=a.lat-b.lat;if(Math.abs(ds)<24&&Math.abs(dl)<26){let overlap=26-Math.abs(dl),sign=Math.sign(dl)||1;a.latV+=sign*overlap*.75;b.latV-=sign*overlap*.75;let av=a.v;a.v=b.v*.995;b.v=av*.995}}
}
function update(dt,now){
 if(state!=='racing')return;let elapsed=(now-startTime)/1000;timerEl.textContent=elapsed.toFixed(1);
 const base=track.total/30;
 marbles.forEach((m,idx)=>{
  if(m.finished)return;
  let wave=Math.sin(elapsed*.7+m.seed)*.035+Math.sin(elapsed*1.6+m.seed*.31)*.025;
  let desired=base*(1+wave);
  m.v+=(desired-m.v)*dt*.75;
  m.v+=rnd(-1,1)*base*.025*dt;
  m.latV+=Math.sin(elapsed*1.8+m.seed)*dt*7;
  m.latV*=Math.pow(.985,dt*60);
  for(let oi=0;oi<track.obstacles.length;oi++){let o=track.obstacles[oi],d=Math.abs(m.s-o.s);if(d<25&&m.lastObs!==oi){m.lastObs=oi;if(o.type==='bumper'){m.latV+=rnd(-38,38);m.v*=rnd(.83,1.04)}else if(o.type==='gate'){m.latV+=rnd(-18,18);m.v*=rnd(.88,1.03)}else{m.latV+=rnd(-28,28);m.v*=rnd(.86,1.06)}}if(d>45&&m.lastObs===oi)m.lastObs=-1}
  m.lat+=m.latV*dt;let lim=track.laneW*.34;if(Math.abs(m.lat)>lim){m.lat=clamp(m.lat,-lim,lim);m.latV*=-.52;m.v*=.975}
  m.s+=Math.max(base*.66,m.v)*dt;
  m.spin+=m.v*dt/15;
  if(m.s>=track.total){m.s=track.total;m.finished=true;m.finishTime=elapsed;finishOrder.push(idx);if(finishOrder.length===4)endRace()}
 });
 collide();
 const active=marbles.filter(m=>!m.finished);let target=active.length?Math.max(...active.map(m=>m.s)):track.total;cameraS+=(target-cameraS)*Math.min(1,dt*1.7);cameraS=clamp(cameraS,0,track.total);
 const order=marbles.map((m,i)=>({i,s:m.s,fin:m.finished,ft:m.finishTime??999})).sort((a,b)=>a.fin&&b.fin?a.ft-b.ft:a.fin?-1:b.fin?1:b.s-a.s);order.forEach((o,k)=>marbles[o.i].rank=k+1);updateHud();
}
function loop(now){let dt=Math.min(.033,(now-last)/1000||.016);last=now;update(dt,now);draw();if(state==='racing')raf=requestAnimationFrame(loop)}
async function startRace(){
 if(state!=='idle'&&state!=='done')return;buildTrack();reset();state='countdown';overlay.style.display='flex';
 for(let n=3;n>=1;n--){overlay.innerHTML=`<div class="countdown">${n}</div>`;await new Promise(r=>setTimeout(r,650))}
 overlay.innerHTML='<div class="countdown">GO!</div>';await new Promise(r=>setTimeout(r,420));overlay.style.display='none';state='racing';startTime=performance.now();last=startTime;marbles.forEach(m=>m.v=track.total/30*rnd(.9,1.0));raf=requestAnimationFrame(loop)
}
function endRace(){state='done';cancelAnimationFrame(raf);let w=marbles[finishOrder[0]],lastFin=marbles[finishOrder[3]].finishTime;timerEl.textContent=lastFin.toFixed(1);overlay.style.display='flex';overlay.innerHTML=`<div class="card"><h2><span class="winner">${w.name}</span> Wins!</h2><p>Winning time: <strong>${w.finishTime.toFixed(1)}s</strong><br>All marbles finished in ${lastFin.toFixed(1)}s.</p><button id="againBtn">RACE AGAIN</button></div>`;document.getElementById('againBtn').addEventListener('click',startRace)}
document.getElementById('startBtn').addEventListener('click',startRace);makeHud();resize();
})();
</script>
</body>
</html>
