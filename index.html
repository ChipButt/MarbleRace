<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Marble Run Race</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <div class="top">
    <div><div class="title">MARBLE RUN RACE</div><div class="sub">Gravity-driven marble physics. No steering.</div></div>
    <div class="topActions"><button class="resetBtn" id="resetBtn">RESET RACE</button><div class="timer" id="timer">00.0</div></div>
  </div>
  <div class="stage" id="stage">
    <canvas id="game"></canvas>
    <div class="minimap"><div class="maplabel">COURSE</div><canvas id="map"></canvas></div>
    <div class="overlay" id="overlay"></div>
  </div>
  <div class="hud" id="hud"></div>
</div>
<script src="game.js"></script>
</body>
</html>
